<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Punto Directo Media — Panel de galerías</title>
<link rel="stylesheet" href="assets/css/style.css?v=20260920-logo" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="admin.html" aria-label="Punto Directo">
      <img src="assets/img/punto-directo.png" alt="Punto Directo" />
    </a>
    <nav>
      <a href="admin.html">Galerías</a>
      <a href="admin-watermark.html">Marca de agua</a>
      <a href="admin-orders.html">Pedidos</a>
      <a href="admin-messages.html">Mensajes</a>
      <a href="dashboard.html">Mi cuenta</a>
      <a href="#" id="logout-link">Cerrar sesión</a>
    </nav>
  </header>

  <main class="admin-page">
    <div class="page-header">
      <h1>Mis galerías</h1>
    </div>

    <div id="list-message" class="message"></div>
    <div class="gallery-list" id="gallery-list"></div>
    <p class="empty-state" id="empty-state" style="display:none; cursor:pointer;">Todavía no creaste ninguna galería. Tocá acá para crear una.</p>

    <details class="settings-fold" id="create-fold" style="margin-top:18px;">
      <summary>Crear nueva galería</summary>
      <div id="create-message" class="message"></div>
      <form id="create-form">
        <div class="field">
          <label for="gallery-name">Nombre</label>
          <input type="text" id="gallery-name" required placeholder="Ej: Boda Sofía y Juan" />
        </div>
        <div class="field" style="margin-top:14px;">
          <label for="gallery-author">Autor de las fotos</label>
          <input type="text" id="gallery-author" maxlength="150" placeholder="Ej: Patricio Lovisolo" />
        </div>
        <div class="inline-fields" style="margin-top:14px;">
          <label class="checkbox-field">
            <input type="checkbox" id="gallery-public" checked />
            Galería pública (sin contraseña)
          </label>
        </div>
        <div id="private-fields" style="display:none; margin-top:14px;">
          <div class="field">
            <label for="gallery-username">Usuario de acceso</label>
            <input type="text" id="gallery-username" placeholder="Usuario para los clientes" />
          </div>
          <div class="field" style="margin-top:14px;">
            <label for="gallery-password">Contraseña de acceso</label>
            <input type="text" id="gallery-password" placeholder="Contraseña para los clientes" />
          </div>
        </div>
        <div class="field" style="margin-top:14px;">
          <label for="gallery-price">Precio por foto (opcional, en tu moneda)</label>
          <input type="number" id="gallery-price" min="0" step="0.01" placeholder="Ej: 1500 (dejar vacío si no vendés fotos)" />
        </div>
        <div class="inline-fields" style="margin-top:14px;">
          <label class="checkbox-field">
            <input type="checkbox" id="gallery-watermark" checked />
            Aplicar marca de agua
          </label>
        </div>
        <div style="margin-top:16px;">
          <button type="submit" class="primary" id="create-btn" style="width:auto; padding:11px 24px;">Crear galería</button>
        </div>
      </form>
    </details>
  </main>

  <script src="assets/js/api.js?v=20260919-ux2"></script>
  <script>
    const session = getSession();
    if (!session) window.location.href = 'login.html';

    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      clearSession();
      window.location.href = 'index.html';
    });

    async function guardAdmin() {
      try {
        const { user } = await apiRequest('/api/auth/me', { token: session.token });
        if (user.role !== 'admin') {
          window.location.href = 'dashboard.html';
        }
      } catch {
        clearSession();
        window.location.href = 'login.html';
      }
    }

    const publicCheckbox = document.getElementById('gallery-public');
    const privateFields = document.getElementById('private-fields');
    const createFold = document.getElementById('create-fold');
    publicCheckbox.addEventListener('change', () => {
      privateFields.style.display = publicCheckbox.checked ? 'none' : 'block';
    });

    function showMessage(el, text, type) {
      el.textContent = text;
      el.className = `message show ${type}`;
    }

    const listEl = document.getElementById('gallery-list');
    const emptyEl = document.getElementById('empty-state');
    const listMessage = document.getElementById('list-message');

    function renderGalleries(galleries) {
      listEl.innerHTML = '';
      emptyEl.style.display = galleries.length ? 'none' : 'block';

      galleries.forEach((g) => {
        const row = document.createElement('div');
        row.className = 'gallery-row';
        row.innerHTML = `
          <div class="gallery-row-info">
            <h3>${g.name}</h3>
            <div class="meta">
              <span class="badge ${g.isPublic ? 'public' : 'private'}">${g.isPublic ? 'Pública' : 'Privada'}</span>
              ${g.author ? `<span>${g.author}</span>` : ''}
              <span>${g.photoCount} foto${g.photoCount === 1 ? '' : 's'}</span>
              <span>${g.orderCount || 0} pedido${g.orderCount === 1 ? '' : 's'}</span>
              ${g.pricePerPhoto ? `<span>$${Number(g.pricePerPhoto).toLocaleString('es-AR')} / foto</span>` : ''}
            </div>
          </div>
          <div class="gallery-row-actions">
            <a class="secondary" href="admin-orders.html?slug=${encodeURIComponent(g.slug)}">Pedidos</a>
            <a class="secondary" href="admin-gallery.html?slug=${encodeURIComponent(g.slug)}">Administrar</a>
            <button class="secondary" data-id="${g.id}" data-action="delete">Eliminar</button>
          </div>
        `;
        listEl.appendChild(row);
      });

      listEl.querySelectorAll('[data-action="delete"]').forEach((btn) => {
        btn.addEventListener('click', () => deleteGallery(btn.dataset.id));
      });
    }

    async function loadGalleries() {
      try {
        const { galleries } = await apiRequest('/api/galleries', { token: session.token });
        renderGalleries(galleries);
      } catch (err) {
        showMessage(listMessage, err.message, 'error');
      }
    }

    async function deleteGallery(id) {
      if (!confirm('¿Eliminar esta galería y todas sus fotos? Esta acción no se puede deshacer.')) return;
      try {
        await apiRequest(`/api/galleries/${id}`, { method: 'DELETE', token: session.token });
        loadGalleries();
      } catch (err) {
        showMessage(listMessage, err.message, 'error');
      }
    }

    document.getElementById('create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('create-btn');
      const messageEl = document.getElementById('create-message');
      btn.disabled = true;
      btn.textContent = 'Creando...';

      try {
        const name = document.getElementById('gallery-name').value.trim();
        const author = document.getElementById('gallery-author').value.trim();
        const isPublic = publicCheckbox.checked;
        const password = document.getElementById('gallery-password').value;
        const accessUsername = document.getElementById('gallery-username').value.trim();
        const pricePerPhoto = document.getElementById('gallery-price').value;
        const applyWatermark = document.getElementById('gallery-watermark').checked;

        await apiRequest('/api/galleries', {
          method: 'POST',
          token: session.token,
          body: { name, author, isPublic, password, accessUsername, pricePerPhoto, applyWatermark },
        });

        document.getElementById('create-form').reset();
        document.getElementById('gallery-watermark').checked = true;
        publicCheckbox.checked = true;
        privateFields.style.display = 'none';
        createFold.open = false;
        showMessage(listMessage, 'Galería creada.', 'success');
        loadGalleries();
      } catch (err) {
        createFold.open = true;
        showMessage(messageEl, err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crear galería';
      }
    });

    emptyEl.addEventListener('click', () => {
      createFold.open = true;
      document.getElementById('gallery-name').focus();
    });

    guardAdmin();
    loadGalleries();
  </script>
</body>
</html>
