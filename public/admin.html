<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FotoGalería Pro — Panel de galerías</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="admin.html">Foto<span>Galería</span> Pro</a>
    <nav>
      <a href="admin-orders.html">Pedidos</a>
      <a href="admin-messages.html">Mensajes</a>
      <a href="dashboard.html">Mi cuenta</a>
      <a href="#" id="logout-link">Cerrar sesión</a>
    </nav>
  </header>

  <main class="admin-page">
    <div class="page-header">
      <h1>Mis galerías</h1>
    </div>

    <div class="create-panel">
      <h2>Crear nueva galería</h2>
      <div id="create-message" class="message"></div>
      <form id="create-form">
        <div class="field">
          <label for="gallery-name">Nombre</label>
          <input type="text" id="gallery-name" required placeholder="Ej: Boda Sofía y Juan" />
        </div>
        <div class="inline-fields">
          <label class="checkbox-field">
            <input type="checkbox" id="gallery-public" checked />
            Galería pública (sin contraseña)
          </label>
        </div>
        <div id="private-fields" style="display:none; margin-top:14px;">
          <div class="field">
            <label for="gallery-username">Usuario de acceso</label>
            <input type="text" id="gallery-username" placeholder="Usuario para los clientes" />
          </div>
          <div class="field" style="margin-top:14px;">
            <label for="gallery-password">Contraseña de acceso</label>
            <input type="text" id="gallery-password" placeholder="Contraseña para los clientes" />
          </div>
        </div>
        <div class="field" style="margin-top:14px;">
          <label for="gallery-price">Precio por foto (opcional, en tu moneda)</label>
          <input type="number" id="gallery-price" min="0" step="0.01" placeholder="Ej: 1500 (dejar vacío si no vendés fotos)" />
        </div>
        <div style="margin-top:16px;">
          <button type="submit" class="primary" id="create-btn" style="width:auto; padding:11px 24px;">Crear galería</button>
        </div>
      </form>
    </div>

    <div class="create-panel">
      <h2>Marca de agua</h2>
      <p class="subtitle" style="margin-top:-6px;">Se aplica a las miniaturas y vistas previas que ven los clientes. Las originales quedan limpias para vos.</p>
      <div id="watermark-message" class="message"></div>
      <form id="watermark-form">
        <div class="field">
          <label for="wm-text">Texto</label>
          <input type="text" id="wm-text" maxlength="48" placeholder="FotoGalería Pro" />
        </div>
        <div class="inline-fields" style="margin-top:14px;">
          <div class="field">
            <label for="wm-design">Diseño</label>
            <select id="wm-design">
              <option value="text">Solo texto</option>
              <option value="logo">Solo logo</option>
              <option value="both">Logo + texto</option>
            </select>
          </div>
          <div class="field">
            <label for="wm-pattern">Patrón</label>
            <select id="wm-pattern">
              <option value="diagonal">Diagonal</option>
              <option value="tile">Mosaico</option>
              <option value="center">Al centro</option>
              <option value="corners">En las esquinas</option>
            </select>
          </div>
          <div class="field">
            <label for="wm-texture">Textura</label>
            <select id="wm-texture">
              <option value="soft">Suave</option>
              <option value="strong">Marcada</option>
              <option value="outline">Contorno</option>
            </select>
          </div>
        </div>
        <div class="field" style="margin-top:14px;">
          <label for="wm-logo">Subir logo / sello (PNG o WEBP)</label>
          <input type="file" id="wm-logo" accept="image/png,image/webp,image/jpeg" />
          <label class="checkbox-field" style="margin-top:8px;">
            <input type="checkbox" id="wm-clear-logo" />
            Quitar logo actual
          </label>
        </div>
        <div class="watermark-preview-wrap">
          <img id="wm-preview" alt="Vista previa de la marca de agua" />
        </div>
        <div style="margin-top:16px;">
          <button type="submit" class="primary" id="wm-save-btn" style="width:auto; padding:11px 24px;">Guardar marca de agua</button>
        </div>
      </form>
    </div>

    <div id="list-message" class="message"></div>
    <div class="gallery-list" id="gallery-list"></div>
    <p class="empty-state" id="empty-state" style="display:none;">Todavía no creaste ninguna galería.</p>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    const session = getSession();
    if (!session) window.location.href = 'login.html';

    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      clearSession();
      window.location.href = 'index.html';
    });

    async function guardAdmin() {
      try {
        const { user } = await apiRequest('/api/auth/me', { token: session.token });
        if (user.role !== 'admin') {
          window.location.href = 'dashboard.html';
        }
      } catch {
        clearSession();
        window.location.href = 'login.html';
      }
    }

    const publicCheckbox = document.getElementById('gallery-public');
    const privateFields = document.getElementById('private-fields');
    publicCheckbox.addEventListener('change', () => {
      privateFields.style.display = publicCheckbox.checked ? 'none' : 'block';
    });

    function showMessage(el, text, type) {
      el.textContent = text;
      el.className = `message show ${type}`;
    }

    const listEl = document.getElementById('gallery-list');
    const emptyEl = document.getElementById('empty-state');
    const listMessage = document.getElementById('list-message');

    function renderGalleries(galleries) {
      listEl.innerHTML = '';
      emptyEl.style.display = galleries.length ? 'none' : 'block';

      galleries.forEach((g) => {
        const row = document.createElement('div');
        row.className = 'gallery-row';
        row.innerHTML = `
          <div class="gallery-row-info">
            <h3>${g.name}</h3>
            <div class="meta">
              <span class="badge ${g.isPublic ? 'public' : 'private'}">${g.isPublic ? 'Pública' : 'Privada'}</span>
              <span>${g.photoCount} foto${g.photoCount === 1 ? '' : 's'}</span>
              ${g.pricePerPhoto ? `<span>$${Number(g.pricePerPhoto).toLocaleString('es-AR')} / foto</span>` : ''}
            </div>
          </div>
          <div class="gallery-row-actions">
            <a class="secondary" href="admin-gallery.html?slug=${g.slug}">Administrar</a>
            <button class="secondary" data-id="${g.id}" data-action="delete">Eliminar</button>
          </div>
        `;
        listEl.appendChild(row);
      });

      listEl.querySelectorAll('[data-action="delete"]').forEach((btn) => {
        btn.addEventListener('click', () => deleteGallery(btn.dataset.id));
      });
    }

    async function loadGalleries() {
      try {
        const { galleries } = await apiRequest('/api/galleries', { token: session.token });
        renderGalleries(galleries);
      } catch (err) {
        showMessage(listMessage, err.message, 'error');
      }
    }

    async function deleteGallery(id) {
      if (!confirm('¿Eliminar esta galería y todas sus fotos? Esta acción no se puede deshacer.')) return;
      try {
        await apiRequest(`/api/galleries/${id}`, { method: 'DELETE', token: session.token });
        loadGalleries();
      } catch (err) {
        showMessage(listMessage, err.message, 'error');
      }
    }

    document.getElementById('create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('create-btn');
      const messageEl = document.getElementById('create-message');
      btn.disabled = true;
      btn.textContent = 'Creando...';

      try {
        const name = document.getElementById('gallery-name').value.trim();
        const isPublic = publicCheckbox.checked;
        const password = document.getElementById('gallery-password').value;
        const accessUsername = document.getElementById('gallery-username').value.trim();
        const pricePerPhoto = document.getElementById('gallery-price').value;

        await apiRequest('/api/galleries', {
          method: 'POST',
          token: session.token,
          body: { name, isPublic, password, accessUsername, pricePerPhoto },
        });

        document.getElementById('create-form').reset();
        privateFields.style.display = 'none';
        showMessage(messageEl, 'Galería creada.', 'success');
        loadGalleries();
      } catch (err) {
        showMessage(messageEl, err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crear galería';
      }
    });

    function watermarkPreviewUrl() {
      const params = new URLSearchParams({
        text: document.getElementById('wm-text').value.trim() || 'FotoGalería Pro',
        design: document.getElementById('wm-design').value,
        pattern: document.getElementById('wm-pattern').value,
        texture: document.getElementById('wm-texture').value,
        t: Date.now(),
      });
      return `/api/watermark/preview?${params}`;
    }

    async function loadWatermarkPreview() {
      const img = document.getElementById('wm-preview');
      try {
        const res = await fetch(watermarkPreviewUrl(), {
          headers: { Authorization: `Bearer ${session.token}` },
        });
        if (!res.ok) throw new Error('preview');
        const blob = await res.blob();
        img.src = URL.createObjectURL(blob);
      } catch {
        img.removeAttribute('src');
      }
    }

    async function loadWatermarkSettings() {
      try {
        const { settings } = await apiRequest('/api/watermark', { token: session.token });
        document.getElementById('wm-text').value = settings.text || '';
        document.getElementById('wm-design').value = settings.design || 'text';
        document.getElementById('wm-pattern').value = settings.pattern || 'diagonal';
        document.getElementById('wm-texture').value = settings.texture || 'soft';
        loadWatermarkPreview();
      } catch {
        // El panel de galerías sigue funcionando aunque falte la marca.
      }
    }

    ['wm-text', 'wm-design', 'wm-pattern', 'wm-texture'].forEach((id) => {
      document.getElementById(id).addEventListener('change', loadWatermarkPreview);
    });

    document.getElementById('watermark-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('wm-save-btn');
      const messageEl = document.getElementById('watermark-message');
      btn.disabled = true;
      btn.textContent = 'Guardando...';
      const body = new FormData();
      body.append('text', document.getElementById('wm-text').value.trim());
      body.append('design', document.getElementById('wm-design').value);
      body.append('pattern', document.getElementById('wm-pattern').value);
      body.append('texture', document.getElementById('wm-texture').value);
      if (document.getElementById('wm-clear-logo').checked) body.append('clearLogo', '1');
      const logo = document.getElementById('wm-logo').files[0];
      if (logo) body.append('logo', logo);

      try {
        await apiRequest('/api/watermark', { method: 'PUT', token: session.token, body, isFormData: true });
        document.getElementById('wm-logo').value = '';
        document.getElementById('wm-clear-logo').checked = false;
        showMessage(messageEl, 'Marca de agua guardada. En cada galería podés reaplicarla a las fotos ya subidas.', 'success');
        loadWatermarkPreview();
      } catch (err) {
        showMessage(messageEl, err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar marca de agua';
      }
    });

    guardAdmin();
    loadGalleries();
    loadWatermarkSettings();
  </script>
</body>
</html>
