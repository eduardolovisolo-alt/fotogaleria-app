<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Punto Directo Media — Nueva contraseña</title>
<link rel="stylesheet" href="assets/css/style.css?v=20260920-logo" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Punto Directo">
      <img src="assets/img/punto-directo.png" alt="Punto Directo" />
    </a>
    <nav>
      <a href="login.html">Ingresar</a>
    </nav>
  </header>

  <main class="page">
    <div class="card">
      <h1>Nueva contraseña</h1>
      <p class="subtitle">Elegí una contraseña de al menos 8 caracteres.</p>

      <div id="message" class="message"></div>

      <form id="reset-form">
        <div class="field">
          <label for="password">Nueva contraseña</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="password-confirm">Repetir contraseña</label>
          <input type="password" id="password-confirm" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" class="primary" id="submit-btn">Guardar contraseña</button>
      </form>

      <p class="alt-action"><a href="login.html">Volver a iniciar sesión</a></p>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const form = document.getElementById('reset-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
    }

    if (!token) {
      showMessage('El enlace es inválido. Pedí uno nuevo desde recuperar contraseña.', 'error');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('password-confirm').value;
      if (password !== confirm) {
        showMessage('Las contraseñas no coinciden.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Guardando...';

      try {
        const data = await apiRequest('/api/auth/reset-password', { method: 'POST', body: { token, password } });
        showMessage(data.message, 'success');
        form.reset();
        setTimeout(() => { window.location.href = 'login.html'; }, 1600);
      } catch (err) {
        showMessage(err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Guardar contraseña';
      }
    });
  </script>
</body>
</html>
