<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FotoGalería Pro</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Foto<span>Galería</span> Pro</a>
    <nav>
      <a href="index.html">← Volver a galerías</a>
    </nav>
  </header>

  <div id="lock-view" class="lock-screen" style="display:none;">
    <div class="card">
      <h1 id="lock-title">Galería privada</h1>
      <p class="subtitle">Ingresá el usuario y la contraseña que te compartió el fotógrafo</p>
      <div id="lock-message" class="message"></div>
      <form id="unlock-form">
        <div class="field">
          <label for="gallery-username">Usuario</label>
          <input type="text" id="gallery-username" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="gallery-password">Contraseña</label>
          <input type="password" id="gallery-password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="primary">Entrar</button>
        <a href="index.html" class="secondary" style="display:block; text-align:center; margin-top:12px;">Volver a galerías</a>
      </form>
    </div>
  </div>

  <main id="gallery-view" class="client-page" style="display:none;">
    <div class="client-header">
      <a href="index.html" class="back-link">← Volver a galerías</a>
      <h1 id="gallery-name">Cargando...</h1>
      <p class="gallery-author" id="gallery-author" style="display:none;"></p>
      <p>Elegí tus fotos favoritas tocándolas</p>
    </div>

    <div class="gallery-grid" id="gallery-grid"></div>
    <p class="empty-state" id="empty-state" style="display:none;">Esta galería todavía no tiene fotos.</p>
  </main>

  <div class="selection-bar" id="selection-bar" style="display:none;">
    <span id="selection-count">0 fotos seleccionadas</span>
    <button class="primary" id="continue-btn">Continuar al pedido</button>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close" type="button">Cerrar</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Anterior">‹</button>
    <div class="lightbox-content">
      <div class="lightbox-img-wrap">
        <img id="lightbox-img" class="protected-photo" src="" alt="" draggable="false" />
        <div class="img-shield"></div>
      </div>
      <div class="lightbox-actions">
        <button class="lightbox-select" id="lightbox-select" type="button">Seleccionar</button>
      </div>
    </div>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Siguiente">›</button>
  </div>

  <script src="assets/js/api.js?v=20260919-ux"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    if (!slug) {
      document.body.innerHTML = '<p style="text-align:center; margin-top:100px; color:#9a9a9f;">Falta el link de la galería.</p>';
      throw new Error('missing slug');
    }

    const clientToken = getClientToken();
    let galleryToken = sessionStorage.getItem(`gallery_token_${slug}`) || null;
    let selectedIds = new Set();
    let pricePerPhoto = 0;
    let discountTiers = [];

    function galleryHeaders() {
      return galleryToken ? { 'X-Gallery-Token': galleryToken } : {};
    }

    async function init() {
      try {
        const { gallery } = await apiRequest(`/api/galleries/${slug}`, { extraHeaders: galleryHeaders() });
        pricePerPhoto = Number(gallery.pricePerPhoto) || 0;
        discountTiers = gallery.discountTiers || [];
        if (gallery.locked) {
          showLockScreen(gallery.name);
        } else {
          showGallery(gallery);
        }
      } catch (err) {
        document.body.innerHTML = `<p style="text-align:center; margin-top:100px; color:#9a9a9f;">${err.message}</p>`;
      }
    }

    function showLockScreen(name) {
      document.getElementById('lock-title').textContent = name;
      document.getElementById('lock-view').style.display = 'flex';
      document.getElementById('gallery-view').style.display = 'none';
    }

    function setAuthor(author) {
      const el = document.getElementById('gallery-author');
      if (author) {
        el.textContent = `Fotos de ${author}`;
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    }

    async function showGallery(gallery) {
      document.getElementById('lock-view').style.display = 'none';
      document.getElementById('gallery-view').style.display = 'block';
      document.getElementById('gallery-name').textContent = gallery.name;
      setAuthor(gallery.author);
      await loadSelections();
      await loadPhotos();
    }

    document.getElementById('unlock-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageEl = document.getElementById('lock-message');
      const username = document.getElementById('gallery-username').value.trim();
      const password = document.getElementById('gallery-password').value;

      try {
        const { token } = await apiRequest(`/api/galleries/${slug}/unlock`, {
          method: 'POST',
          body: { username, password },
        });
        galleryToken = token;
        sessionStorage.setItem(`gallery_token_${slug}`, token);
        const { gallery } = await apiRequest(`/api/galleries/${slug}`, { extraHeaders: galleryHeaders() });
        pricePerPhoto = Number(gallery.pricePerPhoto) || 0;
        discountTiers = gallery.discountTiers || [];
        showGallery(gallery);
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = 'message show error';
      }
    });

    const galleryGrid = document.getElementById('gallery-grid');
    const emptyState = document.getElementById('empty-state');
    let currentPhotos = [];
    let currentLightboxIndex = -1;

    async function loadPhotos() {
      const { photos } = await apiRequest(`/api/galleries/${slug}/photos`, { extraHeaders: galleryHeaders() });
      currentPhotos = photos;
      emptyState.style.display = photos.length ? 'none' : 'block';
      galleryGrid.innerHTML = '';
      photos.forEach((photo, index) => {
        const card = document.createElement('div');
        card.className = `client-photo-card${selectedIds.has(photo.id) ? ' selected' : ''}`;
        card.dataset.id = photo.id;
        card.innerHTML = `
          <img class="protected-photo" src="${photo.thumbnailUrl}" alt="${photo.file_name}" loading="lazy" draggable="false" />
          <div class="img-shield"></div>
          <button class="select-indicator" title="Seleccionar">✓</button>
        `;
        card.querySelector('.img-shield').addEventListener('click', () => openLightbox(index));
        card.querySelector('.select-indicator').addEventListener('click', (e) => {
          e.stopPropagation();
          toggleSelect(photo.id, card);
        });
        galleryGrid.appendChild(card);
      });
      updateSelectionBar();
    }

    // --- Lightbox ---
    const lightboxEl = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxSelectBtn = document.getElementById('lightbox-select');

    function openLightbox(index) {
      currentLightboxIndex = index;
      renderLightbox();
      lightboxEl.hidden = false;
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightboxEl.hidden = true;
      document.body.style.overflow = '';
    }

    function renderLightbox() {
      const photo = currentPhotos[currentLightboxIndex];
      if (!photo) return;
      lightboxImg.src = photo.previewUrl || photo.thumbnailUrl;
      lightboxImg.alt = photo.file_name;
      const isSelected = selectedIds.has(photo.id);
      lightboxSelectBtn.textContent = isSelected ? '✓ Seleccionada' : 'Seleccionar';
      lightboxSelectBtn.classList.toggle('selected', isSelected);
    }

    function lightboxStep(delta) {
      if (!currentPhotos.length) return;
      currentLightboxIndex = (currentLightboxIndex + delta + currentPhotos.length) % currentPhotos.length;
      renderLightbox();
    }

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-prev').addEventListener('click', () => lightboxStep(-1));
    document.getElementById('lightbox-next').addEventListener('click', () => lightboxStep(1));
    lightboxEl.addEventListener('click', (e) => {
      if (e.target === lightboxEl) closeLightbox();
    });

    lightboxSelectBtn.addEventListener('click', async () => {
      const photo = currentPhotos[currentLightboxIndex];
      if (!photo) return;
      const card = galleryGrid.querySelector(`[data-id="${photo.id}"]`);
      await toggleSelect(photo.id, card);
      renderLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (lightboxEl.hidden) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') lightboxStep(-1);
      if (e.key === 'ArrowRight') lightboxStep(1);
    });

    let swipeStartX = 0;
    lightboxEl.addEventListener('touchstart', (e) => {
      swipeStartX = e.changedTouches[0].clientX;
    }, { passive: true });
    lightboxEl.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - swipeStartX;
      if (Math.abs(dx) > 40) lightboxStep(dx < 0 ? 1 : -1);
    }, { passive: true });

    async function loadSelections() {
      try {
        const { selectedPhotoIds } = await apiRequest(
          `/api/galleries/${slug}/selections/mine?clientToken=${clientToken}`,
          { extraHeaders: galleryHeaders() }
        );
        selectedIds = new Set(selectedPhotoIds);
      } catch {
        selectedIds = new Set();
      }
    }

    async function toggleSelect(photoId, card) {
      const nowSelected = !selectedIds.has(photoId);
      try {
        await apiRequest(`/api/galleries/${slug}/selections`, {
          method: 'POST',
          extraHeaders: galleryHeaders(),
          body: { photoId, clientToken, selected: nowSelected },
        });
        if (nowSelected) {
          selectedIds.add(photoId);
          card?.classList.add('selected');
        } else {
          selectedIds.delete(photoId);
          card?.classList.remove('selected');
        }
        updateSelectionBar();
      } catch (err) {
        alert(err.message);
      }
    }

    function updateSelectionBar() {
      const bar = document.getElementById('selection-bar');
      const count = selectedIds.size;
      if (count === 0) {
        bar.style.display = 'none';
        document.body.classList.remove('has-selection-bar');
        return;
      }
      bar.style.display = 'flex';
      document.body.classList.add('has-selection-bar');
      const quote = typeof quotePhotoOrder === 'function'
        ? quotePhotoOrder(pricePerPhoto, count, discountTiers)
        : { total: pricePerPhoto * count, percent: 0 };
      const discountText = quote.percent ? ` (−${quote.percent}%)` : '';
      const priceText = pricePerPhoto ? ` — $${quote.total.toLocaleString('es-AR')}${discountText}` : '';
      document.getElementById('selection-count').textContent = `${count} foto${count === 1 ? '' : 's'} seleccionada${count === 1 ? '' : 's'}${priceText}`;
    }

    document.getElementById('continue-btn').addEventListener('click', () => {
      window.location.href = `checkout.html?slug=${encodeURIComponent(slug)}`;
    });

    init();
  </script>
</body>
</html>
