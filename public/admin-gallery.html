<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FotoGalería Pro — Administrar galería</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Foto<span>Galería</span> Pro</div>
    <nav>
      <a href="admin.html">Mis galerías</a>
      <a href="#" id="logout-link">Cerrar sesión</a>
    </nav>
  </header>

  <main class="admin-page">
    <a href="admin.html" class="back-link">← Volver a mis galerías</a>
    <div class="page-header">
      <h1 id="gallery-name">Cargando...</h1>
      <span class="badge" id="gallery-badge"></span>
    </div>

    <div class="share-box">
      <input type="text" id="share-link" readonly />
      <button class="secondary" id="copy-link-btn">Copiar</button>
    </div>

    <div class="create-panel">
      <h2>Configuración de acceso</h2>
      <div id="settings-message" class="message"></div>
      <div class="inline-fields">
        <label class="checkbox-field">
          <input type="checkbox" id="settings-public" />
          Galería pública (sin contraseña)
        </label>
      </div>
      <div class="field" id="settings-password-field" style="margin-top:14px;">
        <label for="settings-password">Nueva contraseña (dejar vacío para no cambiarla)</label>
        <input type="text" id="settings-password" placeholder="Contraseña para los clientes" />
      </div>
      <div class="field" style="margin-top:14px;">
        <label for="settings-price">Precio por foto (dejar vacío si no vendés fotos)</label>
        <input type="number" id="settings-price" min="0" step="0.01" placeholder="Ej: 1500" />
      </div>
      <button class="secondary" id="save-settings-btn" style="margin-top:10px;">Guardar cambios</button>
    </div>

    <div class="upload-box">
      <form id="upload-form">
        <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp" multiple />
        <div class="upload-actions">
          <button type="submit" class="primary" id="upload-btn">Subir fotos</button>
          <button type="button" class="secondary" id="folder-btn">Subir carpeta</button>
        </div>
        <input type="file" id="folder-input" webkitdirectory directory multiple style="display:none;" />
      </form>
      <div id="upload-progress" class="upload-progress" style="display:none;">
        <div class="upload-progress-bar"><div class="upload-progress-fill" id="upload-progress-fill"></div></div>
        <span id="upload-progress-text"></span>
      </div>
    </div>
    <div id="upload-message" class="message"></div>

    <p class="gallery-title">Fotos de esta galería</p>
    <div class="gallery-grid" id="gallery-grid"></div>
    <p class="empty-state" id="empty-state" style="display:none;">Todavía no subiste ninguna foto.</p>

    <p class="gallery-title">Selecciones de clientes</p>
    <div id="selections-box" class="empty-state">Cargando...</div>

    <p class="gallery-title">Pedidos</p>
    <div id="orders-box" class="empty-state">Cargando...</div>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    const session = getSession();
    if (!session) window.location.href = 'index.html';

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    if (!slug) window.location.href = 'admin.html';

    let currentGallery = null;

    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      clearSession();
      window.location.href = 'index.html';
    });

    function showMessage(el, text, type) {
      el.textContent = text;
      el.className = `message show ${type}`;
    }

    async function loadGalleries() {
      const { galleries } = await apiRequest('/api/galleries', { token: session.token });
      const gallery = galleries.find((g) => g.slug === slug);
      if (!gallery) {
        window.location.href = 'admin.html';
        return;
      }
      currentGallery = gallery;

      document.getElementById('gallery-name').textContent = gallery.name;
      const badge = document.getElementById('gallery-badge');
      badge.textContent = gallery.isPublic ? 'Pública' : 'Privada';
      badge.className = `badge ${gallery.isPublic ? 'public' : 'private'}`;

      document.getElementById('share-link').value = `${window.location.origin}/gallery.html?slug=${gallery.slug}`;
      document.getElementById('settings-public').checked = gallery.isPublic;
      document.getElementById('settings-password-field').style.display = gallery.isPublic ? 'none' : 'block';
      document.getElementById('settings-price').value = gallery.pricePerPhoto || '';
    }

    document.getElementById('copy-link-btn').addEventListener('click', () => {
      const input = document.getElementById('share-link');
      input.select();
      navigator.clipboard.writeText(input.value);
      const btn = document.getElementById('copy-link-btn');
      btn.textContent = '¡Copiado!';
      setTimeout(() => { btn.textContent = 'Copiar'; }, 1500);
    });

    document.getElementById('settings-public').addEventListener('change', (e) => {
      document.getElementById('settings-password-field').style.display = e.target.checked ? 'none' : 'block';
    });

    document.getElementById('save-settings-btn').addEventListener('click', async () => {
      const messageEl = document.getElementById('settings-message');
      const isPublic = document.getElementById('settings-public').checked;
      const password = document.getElementById('settings-password').value;
      const pricePerPhoto = document.getElementById('settings-price').value;

      try {
        await apiRequest(`/api/galleries/${currentGallery.id}`, {
          method: 'PUT',
          token: session.token,
          body: { isPublic, password: password || undefined, pricePerPhoto },
        });
        showMessage(messageEl, 'Configuración guardada.', 'success');
        document.getElementById('settings-password').value = '';
        loadGalleries();
      } catch (err) {
        showMessage(messageEl, err.message, 'error');
      }
    });

    // --- Fotos ---
    const galleryGrid = document.getElementById('gallery-grid');
    const emptyState = document.getElementById('empty-state');
    const uploadMessage = document.getElementById('upload-message');

    function renderPhotos(photos) {
      galleryGrid.innerHTML = '';
      emptyState.style.display = photos.length ? 'none' : 'block';
      photos.forEach((photo) => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
          <img src="${photo.thumbnailUrl}" alt="${photo.file_name}" loading="lazy" />
          <button class="delete-btn" data-id="${photo.id}" title="Eliminar">✕</button>
        `;
        galleryGrid.appendChild(card);
      });
      galleryGrid.querySelectorAll('.delete-btn').forEach((btn) => {
        btn.addEventListener('click', () => deletePhoto(btn.dataset.id));
      });
    }

    async function loadPhotos() {
      try {
        const { photos } = await apiRequest(`/api/galleries/${slug}/photos`, { token: session.token });
        renderPhotos(photos);
      } catch (err) {
        showMessage(uploadMessage, err.message, 'error');
      }
    }

    async function deletePhoto(id) {
      try {
        await apiRequest(`/api/galleries/${slug}/photos/${id}`, { method: 'DELETE', token: session.token });
        loadPhotos();
      } catch (err) {
        showMessage(uploadMessage, err.message, 'error');
      }
    }

    const photoInput = document.getElementById('photo-input');
    const folderInput = document.getElementById('folder-input');
    const uploadBtn = document.getElementById('upload-btn');
    const progressBox = document.getElementById('upload-progress');
    const progressFill = document.getElementById('upload-progress-fill');
    const progressText = document.getElementById('upload-progress-text');
    const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/webp'];

    document.getElementById('folder-btn').addEventListener('click', () => folderInput.click());
    folderInput.addEventListener('change', () => uploadFiles(folderInput.files));

    document.getElementById('upload-form').addEventListener('submit', (e) => {
      e.preventDefault();
      uploadFiles(photoInput.files);
    });

    async function uploadFiles(fileList) {
      const files = Array.from(fileList).filter((f) => ALLOWED_TYPES.includes(f.type));
      if (!files.length) {
        showMessage(uploadMessage, 'No se encontraron imágenes válidas (JPG, PNG o WEBP).', 'error');
        return;
      }

      uploadBtn.disabled = true;
      progressBox.style.display = 'block';
      let done = 0;
      let failed = 0;

      for (const file of files) {
        progressText.textContent = `Subiendo ${done + 1} de ${files.length}: ${file.name}`;
        progressFill.style.width = `${Math.round((done / files.length) * 100)}%`;

        const formData = new FormData();
        formData.append('photo', file);

        try {
          await apiRequest(`/api/galleries/${slug}/photos`, {
            method: 'POST',
            body: formData,
            token: session.token,
            isFormData: true,
          });
        } catch (err) {
          failed += 1;
        }
        done += 1;
      }

      progressFill.style.width = '100%';
      progressText.textContent = failed
        ? `Listo: ${done - failed} de ${done} fotos subidas (${failed} fallaron).`
        : `${done} foto${done === 1 ? '' : 's'} subida${done === 1 ? '' : 's'} correctamente.`;

      showMessage(uploadMessage, failed ? 'Algunas fotos no se pudieron subir.' : 'Fotos subidas.', failed ? 'error' : 'success');
      photoInput.value = '';
      folderInput.value = '';
      uploadBtn.disabled = false;
      loadPhotos();

      setTimeout(() => { progressBox.style.display = 'none'; }, 3000);
    }

    // --- Selecciones de clientes ---
    async function loadSelections() {
      const box = document.getElementById('selections-box');
      try {
        const { selections } = await apiRequest(`/api/galleries/${currentGallery.id}/selections`, { token: session.token });
        if (!selections.length) {
          box.textContent = 'Todavía no hay selecciones de clientes.';
          return;
        }
        const groups = {};
        selections.forEach((s) => {
          groups[s.client_token] = groups[s.client_token] || [];
          groups[s.client_token].push(s.file_name);
        });
        box.className = '';
        box.innerHTML = Object.entries(groups)
          .map(([token, files], i) => `<p><strong>Cliente ${i + 1}:</strong> ${files.length} foto(s) seleccionada(s) — ${files.join(', ')}</p>`)
          .join('');
      } catch (err) {
        box.textContent = 'No se pudieron cargar las selecciones.';
      }
    }

    // --- Pedidos ---
    const STATUS_LABELS = { pending: 'Pendiente', paid: 'Pagado', cancelled: 'Cancelado' };

    async function loadOrders() {
      const box = document.getElementById('orders-box');
      try {
        const { orders } = await apiRequest(`/api/galleries/${currentGallery.id}/orders`, { token: session.token });
        if (!orders.length) {
          box.textContent = 'Todavía no hay pedidos.';
          return;
        }
        box.className = '';
        box.innerHTML = orders.map((o) => `
          <div class="order-row">
            <div>
              <strong>${o.client_name}</strong> — ${o.client_email}${o.client_phone ? ` · ${o.client_phone}` : ''}<br/>
              <span class="meta">${o.photo_count} foto(s) · $${Number(o.total_amount).toLocaleString('es-AR')} · ${new Date(o.created_at).toLocaleString('es-AR')}</span>
            </div>
            <select data-id="${o.id}" class="order-status">
              <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>Pendiente</option>
              <option value="paid" ${o.status === 'paid' ? 'selected' : ''}>Pagado</option>
              <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>Cancelado</option>
            </select>
          </div>
        `).join('');

        box.querySelectorAll('.order-status').forEach((select) => {
          select.addEventListener('change', () => updateOrderStatus(select.dataset.id, select.value));
        });
      } catch (err) {
        box.textContent = 'No se pudieron cargar los pedidos.';
      }
    }

    async function updateOrderStatus(orderId, status) {
      try {
        await apiRequest(`/api/orders/${orderId}`, {
          method: 'PUT',
          token: session.token,
          body: { status },
        });
      } catch (err) {
        alert(err.message);
        loadOrders();
      }
    }

    (async () => {
      await loadGalleries();
      loadPhotos();
      loadSelections();
      loadOrders();
    })();
  </script>
</body>
</html>
