<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FotoGalería Pro — Iniciar sesión</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Foto<span>Galería</span> Pro</a>
    <nav>
      <a href="contact.html">Contacto</a>
      <a href="register.html">Crear cuenta</a>
    </nav>
  </header>

  <main class="page">
    <div class="card">
      <h1>Iniciar sesión</h1>
      <p class="subtitle">Accedé a tu panel de galerías</p>

      <div id="message" class="message"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="primary" id="submit-btn">Ingresar</button>
      </form>

      <p class="alt-action"><a href="forgot-password.html">¿Olvidaste tu contraseña?</a></p>
      <p class="alt-action">¿No tenés cuenta? <a href="register.html">Registrate</a></p>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    const existing = getSession();
    if (existing) window.location.href = existing.user?.role === 'admin' ? 'admin.html' : 'dashboard.html';

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando...';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const data = await apiRequest('/api/auth/login', { method: 'POST', body: { email, password } });
        saveSession(data);
        window.location.href = data.user?.role === 'admin' ? 'admin.html' : 'dashboard.html';
      } catch (err) {
        showMessage(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
