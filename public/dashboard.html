<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Punto Directo Media — Mi cuenta</title>
<link rel="stylesheet" href="assets/css/style.css?v=20260920-logo" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Punto Directo">
      <img src="assets/img/punto-directo.png" alt="Punto Directo" />
    </a>
    <nav>
      <a href="#" id="logout-link">Cerrar sesión</a>
    </nav>
  </header>

  <main class="dashboard">
    <div class="profile-card">
      <div class="avatar" id="avatar">?</div>
      <div class="profile-info">
        <h2 id="user-name">Cargando...</h2>
        <p id="user-email"></p>
        <span class="role-badge" id="user-role"></span>
      </div>
    </div>

    <div class="create-panel" id="whatsapp-panel" style="display:none; margin-top:24px;">
      <h2 style="margin-top:0;">WhatsApp del estudio</h2>
      <p class="subtitle" style="margin-top:0;">Este número recibe los pedidos y el botón verde de la web. El del checkout es el del cliente, no este.</p>
      <div id="whatsapp-message" class="message"></div>
      <form id="whatsapp-form">
        <div class="field">
          <label for="whatsapp-number">Número de WhatsApp</label>
          <input type="tel" id="whatsapp-number" required placeholder="Ej: 11 2404 3503" autocomplete="tel" />
        </div>
        <button type="submit" class="primary" id="whatsapp-save" style="margin-top:16px; width:auto; padding:11px 24px;">Guardar número</button>
      </form>
    </div>

    <a href="admin.html" class="admin-link" id="admin-link" style="display:none;">Ir al panel de galerías →</a>
    <a href="admin-orders.html" class="admin-link" id="orders-link" style="display:none;">Ver pedidos →</a>

    <button class="logout-btn" id="logout-btn">Cerrar sesión</button>
  </main>

  <script src="assets/js/api.js?v=20261013-wa"></script>
  <script>
    const session = getSession();
    if (!session) window.location.href = 'login.html';

    function showWhatsAppMessage(text, type) {
      const el = document.getElementById('whatsapp-message');
      el.textContent = text;
      el.className = `message show ${type}`;
    }

    function fillWhatsAppField(user) {
      const stored = user.whatsapp_number || '';
      document.getElementById('whatsapp-number').value = formatWhatsAppDisplay(stored) || formatWhatsAppDisplay(DEFAULT_WHATSAPP_NUMBER);
    }

    async function loadProfile() {
      try {
        const { user } = await apiRequest('/api/auth/me', { token: session.token });
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-email').textContent = user.email;
        document.getElementById('user-role').textContent = user.role;
        document.getElementById('avatar').textContent = user.name.charAt(0).toUpperCase();
        if (user.role === 'admin') {
          document.getElementById('admin-link').style.display = 'block';
          document.getElementById('orders-link').style.display = 'block';
          document.getElementById('whatsapp-panel').style.display = 'block';
          fillWhatsAppField(user);
        }
      } catch (err) {
        clearSession();
        window.location.href = 'login.html';
      }
    }

    function logout() {
      clearSession();
      window.location.href = 'index.html';
    }

    document.getElementById('logout-btn').addEventListener('click', logout);
    document.getElementById('logout-link').addEventListener('click', (e) => { e.preventDefault(); logout(); });

    document.getElementById('whatsapp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('whatsapp-save');
      btn.disabled = true;
      try {
        const { user, whatsapp } = await apiRequest('/api/auth/whatsapp', {
          method: 'PUT',
          token: session.token,
          body: { whatsappNumber: document.getElementById('whatsapp-number').value.trim() },
        });
        fillWhatsAppField(user);
        if (whatsapp && whatsapp.number) setStudioWhatsAppNumber(whatsapp.number);
        showWhatsAppMessage('WhatsApp actualizado. Los pedidos y el botón de la web ya usan este número.', 'success');
      } catch (err) {
        showWhatsAppMessage(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    });

    loadProfile();
  </script>
</body>
</html>
