<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FotoGalería Pro — Mi cuenta</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Foto<span>Galería</span> Pro</div>
    <nav>
      <a href="#" id="logout-link">Cerrar sesión</a>
    </nav>
  </header>

  <main class="dashboard">
    <div class="profile-card">
      <div class="avatar" id="avatar">?</div>
      <div class="profile-info">
        <h2 id="user-name">Cargando...</h2>
        <p id="user-email"></p>
        <span class="role-badge" id="user-role"></span>
      </div>
    </div>
    <button class="logout-btn" id="logout-btn">Cerrar sesión</button>

    <div class="upload-box">
      <form id="upload-form">
        <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp" required />
        <div>
          <button type="submit" class="primary" id="upload-btn">Subir foto</button>
        </div>
      </form>
    </div>
    <div id="upload-message" class="message"></div>

    <p class="gallery-title">Mis fotos</p>
    <div class="gallery-grid" id="gallery-grid"></div>
    <p class="empty-state" id="empty-state" style="display:none;">Todavía no subiste ninguna foto.</p>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    const session = getSession();
    if (!session) window.location.href = 'index.html';

    async function loadProfile() {
      try {
        const { user } = await apiRequest('/api/auth/me', { token: session.token });
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-email').textContent = user.email;
        document.getElementById('user-role').textContent = user.role;
        document.getElementById('avatar').textContent = user.name.charAt(0).toUpperCase();
      } catch (err) {
        clearSession();
        window.location.href = 'index.html';
      }
    }

    function logout() {
      clearSession();
      window.location.href = 'index.html';
    }

    document.getElementById('logout-btn').addEventListener('click', logout);
    document.getElementById('logout-link').addEventListener('click', (e) => { e.preventDefault(); logout(); });

    const uploadForm = document.getElementById('upload-form');
    const uploadBtn = document.getElementById('upload-btn');
    const uploadMessage = document.getElementById('upload-message');
    const galleryGrid = document.getElementById('gallery-grid');
    const emptyState = document.getElementById('empty-state');

    function showUploadMessage(text, type) {
      uploadMessage.textContent = text;
      uploadMessage.className = `message show ${type}`;
    }

    function renderGallery(photos) {
      galleryGrid.innerHTML = '';
      emptyState.style.display = photos.length ? 'none' : 'block';
      photos.forEach((photo) => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
          <img src="${photo.thumbnailUrl}" alt="${photo.file_name}" loading="lazy" />
          <button class="delete-btn" data-id="${photo.id}" title="Eliminar">✕</button>
        `;
        galleryGrid.appendChild(card);
      });

      galleryGrid.querySelectorAll('.delete-btn').forEach((btn) => {
        btn.addEventListener('click', () => deletePhoto(btn.dataset.id));
      });
    }

    async function loadPhotos() {
      try {
        const { photos } = await apiRequest('/api/photos', { token: session.token });
        renderGallery(photos);
      } catch (err) {
        showUploadMessage(err.message, 'error');
      }
    }

    async function deletePhoto(id) {
      try {
        await apiRequest(`/api/photos/${id}`, { method: 'DELETE', token: session.token });
        loadPhotos();
      } catch (err) {
        showUploadMessage(err.message, 'error');
      }
    }

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('photo-input');
      if (!fileInput.files[0]) return;

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Subiendo...';

      const formData = new FormData();
      formData.append('photo', fileInput.files[0]);

      try {
        await apiRequest('/api/photos', { method: 'POST', body: formData, token: session.token, isFormData: true });
        fileInput.value = '';
        showUploadMessage('Foto subida correctamente.', 'success');
        loadPhotos();
      } catch (err) {
        showUploadMessage(err.message, 'error');
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Subir foto';
      }
    });

    loadProfile();
    loadPhotos();
  </script>
</body>
</html>
