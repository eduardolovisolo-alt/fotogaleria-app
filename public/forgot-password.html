<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Punto Directo Media — Recuperar contraseña</title>
<link rel="stylesheet" href="assets/css/style.css?v=20260920-logo" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Punto Directo">
      <img src="assets/img/punto-directo.png" alt="Punto Directo" />
    </a>
    <nav>
      <a href="login.html">Ingresar</a>
    </nav>
  </header>

  <main class="page">
    <div class="card">
      <h1>Recuperar contraseña</h1>
      <p class="subtitle">Te vamos a enviar un enlace si el email está registrado.</p>

      <div id="message" class="message"></div>

      <form id="forgot-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <button type="submit" class="primary" id="submit-btn">Enviar instrucciones</button>
      </form>

      <p class="alt-action"><a href="login.html">Volver a iniciar sesión</a></p>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      try {
        const email = document.getElementById('email').value.trim();
        const data = await apiRequest('/api/auth/forgot-password', { method: 'POST', body: { email } });
        showMessage(data.message, 'success');
        form.reset();
      } catch (err) {
        showMessage(err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar instrucciones';
      }
    });
  </script>
</body>
</html>
