<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Punto Directo Media — Sumate como fotógrafo</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261014-fotos2" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Punto Directo">
      <img src="assets/img/punto-directo.png" alt="Punto Directo" />
    </a>
    <nav>
      <a href="contact.html">Contacto</a>
      <a href="login.html">Ingresar</a>
    </nav>
  </header>

  <main class="page">
    <div class="card">
      <h1>Sumate como fotógrafo</h1>
      <p class="subtitle">Pedís el acceso, lo aprobamos y después gestionás tus galerías y pedidos. El cliente no necesita cuenta.</p>

      <div id="message" class="message"></div>

      <form id="register-form">
        <div class="field">
          <label for="name">Nombre público</label>
          <input type="text" id="name" required autocomplete="name" placeholder="Ej: Renata Lovisolo" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="whatsapp">WhatsApp para recibir pedidos</label>
          <input type="tel" id="whatsapp" required placeholder="Ej: 11 2404 3503" autocomplete="tel" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" class="primary" id="submit-btn">Enviar solicitud</button>
      </form>

      <p class="alt-action">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
      <p class="alt-action">¿Te compartieron un link de fotos? No hace falta registrarte. Entrá a la galería y pedí.</p>
    </div>
  </main>

  <script src="assets/js/whatsapp-studio.js?v=20261014-wa2"></script>
  <script src="assets/js/api.js?v=20261014-fotos2"></script>
  <script>
    const form = document.getElementById('register-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      try {
        const data = await apiRequest('/api/auth/register', {
          method: 'POST',
          body: {
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            asPhotographer: true,
            whatsappNumber: document.getElementById('whatsapp').value.trim(),
          },
        });
        saveSession(data);
        window.location.href = data.panel || 'dashboard.html';
      } catch (err) {
        showMessage(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar solicitud';
      }
    });
  </script>
</body>
</html>
