<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FotoGalería Pro — Crear cuenta</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Foto<span>Galería</span> Pro</div>
    <nav>
      <a href="index.html">Ingresar</a>
    </nav>
  </header>

  <main class="page">
    <div class="card">
      <h1>Crear cuenta</h1>
      <p class="subtitle">Registrate para acceder a tus fotos</p>

      <div id="message" class="message"></div>

      <form id="register-form">
        <div class="field">
          <label for="name">Nombre</label>
          <input type="text" id="name" required autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" class="primary" id="submit-btn">Crear cuenta</button>
      </form>

      <p class="alt-action">¿Ya tenés cuenta? <a href="index.html">Iniciá sesión</a></p>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    const form = document.getElementById('register-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creando cuenta...';

      try {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const data = await apiRequest('/api/auth/register', { method: 'POST', body: { name, email, password } });
        saveSession(data);
        window.location.href = 'dashboard.html';
      } catch (err) {
        showMessage(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>
